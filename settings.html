<div class="telegram-connector_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Telegram Connector 设置</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- 基础连接设置 -->
            <div class="telegram-connector_block flex-container">
                <label for="telegram_bridge_url">Bridge 服务器 WebSocket URL</label>
                <input type="text" id="telegram_bridge_url" class="text_pole" placeholder="例如：ws://127.0.0.1:8080">
                <div id="telegram_connection_status" style="margin-top: 10px; font-weight: bold;">状态： 请点击连接按钮</div>
            </div>

            <div class="telegram-connector_block flex-container">
                <input id="telegram_connect_button" class="menu_button" type="button" value="连接" />
                <input id="telegram_disconnect_button" class="menu_button" type="button" value="断开" />
            </div>

            <div class="telegram-connector_block flex-container">
                <label class="checkbox_label" for="telegram_auto_connect">
                    <input type="checkbox" id="telegram_auto_connect">
                    <span>页面加载时自动连接</span>
                </label>
            </div>

            <hr class="sysHR" />

            <!-- Multiplayer 群组模式设置 -->
            <div class="telegram-connector_block">
                <label class="checkbox_label" for="telegram_multiplayer_enabled">
                    <input type="checkbox" id="telegram_multiplayer_enabled">
                    <span><b>Multiplayer 模式（Telegram 群组）</b></span>
                </label>
                <small style="display:block; margin-top:4px; opacity:0.7;">
                    群组内多名玩家可与同一 AI 角色进行多人角色扮演。启用后，AI 将看到每条消息对应的玩家名。
                </small>
            </div>

            <div class="telegram-connector_block flex-container">
                <label for="telegram_user_prefix">玩家消息前缀格式</label>
                <select id="telegram_user_prefix" class="text_pole">
                    <option value="<用户>: ">&lt;玩家名&gt;: </option>
                    <option value="用户: ">玩家名: </option>
                    <option value="[用户]: ">[玩家名]: </option>
                    <option value="*用户* ">*玩家名* </option>
                </select>
            </div>

            <div class="telegram-connector_block flex-container">
                <label for="telegram_default_mode">默认游戏模式</label>
                <select id="telegram_default_mode" class="text_pole">
                    <option value="instant">即时模式 - 每条消息立即触发 AI 回复</option>
                    <option value="buffered">缓冲模式 - 收集一段时间内所有玩家消息后合并回复</option>
                </select>
            </div>

            <div class="telegram-connector_block flex-container">
                <label for="telegram_buffer_window">缓冲窗口（秒）</label>
                <input type="number" id="telegram_buffer_window" class="text_pole" min="1" max="300" value="30">
            </div>

            <div class="telegram-connector_block flex-container">
                <label for="telegram_buffer_max">缓冲最大消息数</label>
                <input type="number" id="telegram_buffer_max" class="text_pole" min="1" max="50" value="8">
            </div>

            <hr class="sysHR" />
            <small style="opacity:0.6; display:block;">
                💡 使用提示：<br>
                · 将机器人拉入群组并设置为管理员，玩家在群内发言即可与 AI 互动。<br>
                · 即时模式：每条玩家消息都会触发 AI 回复（生成中收到的消息会自动排队）。<br>
                · 缓冲模式：适合多人轮流行动的 RPG 场景，玩家消息会合并成一条交给 AI，避免刷屏。<br>
                · 私聊中不会添加玩家名前缀，行为与普通模式一致。
            </small>
        </div>
    </div>
</div>
